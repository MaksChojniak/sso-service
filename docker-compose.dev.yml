services:
  db:
    env_file: ./docker/postgres/.env
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build:
      target: dev
    env_file:
      - ./docker/postgres/.env
      - ./docker/backend/.env
    volumes:
      - ./backend:/app
    networks:
      default: {}
      proxy:
        aliases:
          - sso-backend

  frontend:
    build:
      target: dev
    env_file: ./docker/frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      default: {}
      proxy:
        aliases:
          - sso-frontend

networks:
  default: {}
  proxy:
    name: proxy
    external: true