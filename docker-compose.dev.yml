services:
  db:
    env_file: ./docker/postgres/.env
    ports:
      - "5432:5432"

  backend:
    build:
      target: dev
    env_file:
      - ./docker/postgres/.env
      - ./docker/backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build:
      target: dev
    env_file: ./docker/frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"